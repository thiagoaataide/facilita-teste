/*
    Para mais informações de como efetuar a correta configuração desse arquivo,
    consulte a documentação oficial da Sankkhya no link abaixo:
    <a href="https://developer.sankhya.com.br/docs/03_conf_addonstudio"/>
 */

buildscript {

    repositories{
        mavenLocal()
        mavenCentral()
        maven {
            url = uri("https://artifacts-partners.sankhya.com.br/repository/maven-releases")
        }
    }

    dependencies {
        classpath "br.com.sankhya.studio:gradle-plugin:2+"
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.0.0-1.0.24"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0"
    }
}

// Identidade provisória do add-on Facilita. Confirmar domínio/package-base antes
// da primeira publicação do componente.
group = 'br.com.facilitatelecom.apuracao.fatura'
//Especifica a versão do addon. É útil para controle de versões, deploys e compatibilidade com o sistema.
version="1.0.8"
//Define uma breve descrição do addon, explicando sua funcionalidade ou objetivo principal.
description = "Facilita - Service Provider da Apuração de Faturas"


apply(plugin: "br.com.sankhya.addonstudio")
snkmodule {
    //Informe aqui o caminho de instalação do WildFly. Exemplo: C:\\wildfly_producao
    // Somente lê a variável do ambiente; a configuração não executa deploy.
    serverFolder = "C:\\wildfly_producao"
    //Informe aqui a versão mínima da plataforma Sankhya que seu add-on suporta.
    plataformaMinima = "4.28"
}

addon {
    /*
        Ao habilitar o autoDDL, os scripts de criação de tabelas em dbscripts são ignorados,
        e as tabelas são geradas automaticamente com base nas entidades definidas em datadictionary*.
        Para usar scripts manuais, defina autoDDL=false. Para mais informações, consulte:
        <a href="https://developer.sankhya.com.br/docs/02_autoddl">
    */
    autoDDL=false
    // O appKey é fornecido apenas pelo ambiente de build. Não reutilizar o
    // appKey do template nem o appKey do projeto legado.
    appKey="0bace5b4-6687-4507-9093-a80a82a03bcb"
    // Valor provisório até a identidade do parceiro ser confirmada no Portal.
    parceiroNome = "GET Grupo"
}
